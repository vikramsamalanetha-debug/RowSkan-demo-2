name: RowSkan browser checks
on:
  pull_request:
    paths: ['index.html', 'web/**', 'tests/**', 'sw.js', 'manifest.webmanifest', '.github/workflows/rowskan-web.yml']
  push:
    branches: ['main', 'production/local-first-release']
    paths: ['index.html', 'web/**', 'tests/**', 'sw.js', 'manifest.webmanifest', '.github/workflows/rowskan-web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node --check web/release.mjs
      - run: node --check sw.js
